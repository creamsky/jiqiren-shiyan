# ROS teb_local_planner 0.9.1. Velocity/acceleration bounds are loaded from source_limits.
TebLocalPlannerROS:
  odom_topic: /scout_lab/odom
  map_frame: camera_init
  footprint_model:
    type: polygon
    vertices: [[0.325,0.275],[0.325,-0.275],[-0.325,-0.275],[-0.325,0.275]]
  min_turning_radius: 0.0
  wheelbase: 0.0
  cmd_angle_instead_rotvel: false
  max_vel_y: 0.0
  acc_lim_y: 0.0
  xy_goal_tolerance: 0.2
  yaw_goal_tolerance: 3.141593
  free_goal_vel: false
  teb_autosize: true
  dt_ref: 0.25
  dt_hysteresis: 0.025
  min_samples: 8
  max_samples: 50
  global_plan_overwrite_orientation: true
  allow_init_with_backwards_motion: true
  max_global_plan_lookahead_dist: 4.5
  global_plan_prune_distance: 1.0
  feasibility_check_no_poses: 10
  min_obstacle_dist: 0.10
  inflation_dist: 0.35
  include_costmap_obstacles: true
  costmap_obstacles_behind_robot_dist: 1.0
  obstacle_poses_affected: 15
  no_inner_iterations: 5
  no_outer_iterations: 4
  optimization_activate: true
  penalty_epsilon: 0.03
  weight_obstacle: 70.0
  weight_inflation: 0.2
  weight_optimaltime: 1.0
  weight_shortest_path: 0.0
  weight_kinematics_nh: 1000.0
  weight_kinematics_forward_drive: 1.0
  enable_homotopy_class_planning: true
  enable_multithreading: true
  max_number_classes: 4
  selection_cost_hysteresis: 1.15
  selection_prefer_initial_plan: 0.9
  roadmap_graph_no_samples: 15
  roadmap_graph_area_width: 6.0
  h_signature_prescaler: 0.5
  h_signature_threshold: 0.1
  switching_blocking_period: 1.0
