<!doctype html><html lang="zh-CN" data-theme="dark"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>实验三扩展 · 机器人实验</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/glass.css"><link rel="stylesheet" href="/simulation/field.css"><script src="/liquid.js" defer></script>
<body class="simulation-console"><!--SHARED_SYMBOLS--><main class="workspace"><section class="scene">
<div id="nativeViewport" hidden aria-label="原生 Gazebo 三维场景"></div>
<div id="nativeRecovery" class="glass" hidden><span id="nativeReason" role="status"></span><div><button id="retryViewer" class="secondary">重连画面</button><a href="http://127.0.0.1:9092/vnc_lite.html?path=websockify" target="_blank" rel="noopener" class="text-button">独立窗口 ↗</a></div></div>
<div id="mapViewport"><canvas id="mapCanvas" aria-label="实际雷达点云与场景编辑俯视图"></canvas></div>
<div class="scene-top"><div class="scene-caption"><div><span class="eyebrow">SCOUT MINI / GAZEBO</span><h1>避障实验场</h1></div><span class="scene-divider"></span><span id="nativeStatus">原生 Gazebo · 等待连接</span></div><div class="scene-tools glass"><nav class="segmented control-targets" aria-label="控制目标"><a href="/simulation/" class="active" aria-current="page">本地仿真</a><a href="/hardware/" data-target="hardware">真实机器人</a></nav><span class="dock-divider"></span><button id="themeToggle" class="icon-button" title="切换主题"><svg><use href="#i-theme"/></svg></button></div></div>
<div class="scene-legend"><span><i class="dot cyan"></i>激光回波</span><span><i class="line amber"></i>实际轨迹</span><span>规划路径</span></div>
<div class="scene-bottom"><div class="view-dock glass"><div class="segmented"><button id="mapView" class="active" aria-pressed="true">点云俯视</button><button id="nativeView" aria-pressed="false">嵌入原生</button></div><button id="fitMap" class="follow">视图复位</button><button id="fullNative" class="follow" title="全屏观察 Gazebo，按 Esc 返回">全屏观察</button><span class="dock-divider"></span><a id="openNative" href="/simulation/gazebo/" target="_blank" rel="noopener" class="native-open">独立打开原生 Gazebo ↗</a></div><div class="scene-readout"><span id="engine">本地仿真 · 离线</span></div></div>
<section class="scene-telemetry glass"><div><small>车体线速度</small><div><strong id="v">—</strong><span>m/s</span></div></div><div><small>车体角速度</small><div><strong id="w">—</strong><span>rad/s</span></div></div><div><small>观测净距</small><div><strong id="gap">—</strong><span>m</span></div></div><div><small>行驶距离</small><div><strong id="distance">—</strong><span>m</span></div></div></section>
</section><aside class="inspector glass"><section class="connection-panel"><div class="connection-heading"><span class="badge">本地仿真</span><span class="address mono">SCOUT MINI · ROS</span><button id="startSimulation" class="text-button">启动仿真</button></div><div class="connection-detail"><span id="note" role="status"></span></div></section>
<div class="inspector-scroll"><section class="task-panel"><div class="section-heading"><h2>实验三扩展</h2><span class="section-index">目标导航</span></div>
<label class="experiment-picker"><span class="experiment-icon"><svg><use href="#i-map"/></svg></span><span class="experiment-copy"><small>场景布置</small><select id="preset"><option>交错桩桶</option><option>双侧通道</option><option>空场</option><option hidden>自定义</option></select></span></label>
<div class="sim-tools"><button class="secondary active" data-tool="pan">平移</button><button class="secondary" data-tool="cone">放桩桶</button><button class="secondary" data-tool="block">放路障</button><button class="secondary" data-tool="goal">选终点</button><button class="secondary" data-tool="erase">移除</button></div><p class="subtle" id="editHint">选择编辑工具后，在点云俯视图上操作。在线时自动同步障碍。</p>
<div class="status-row"><span>终点 X / Y</span><strong id="xy"></strong></div><div class="status-row"><span>障碍物</span><strong id="count"></strong></div>
<div class="actions"><button class="primary" id="go">开始导航</button><button class="secondary" id="apply">同步场景</button><button class="secondary" id="reset">车辆复位</button></div></section>
<section class="manual-panel"><div class="section-heading"><h2>手动驾驶</h2><span class="tag">仿真底盘</span></div><div class="mode-buttons"><button class="secondary" id="manual">启用键盘驾驶</button><button class="text-button" id="endManual">返回自动</button></div><!--SHARED_DRIVE--><!--SHARED_DRIVE_SETTINGS--><button class="text-button" id="save">导出场景与运行记录 ↗</button></section></div>
<div class="stop-panel"><div class="lease-row"><span>Gazebo 控制通道</span><span>空格停车</span></div><button id="stop" class="stop"><span><i></i>停止运动</span><kbd>SPACE</kbd></button></div></aside></main><script type="module" src="/simulation/native.js"></script><script type="module" src="/simulation/field.js"></script></body></html>
