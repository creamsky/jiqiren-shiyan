base_global_planner: navfn/NavfnROS
base_local_planner: dwa_local_planner/DWAPlannerROS
controller_frequency: 10.0
planner_frequency: 2.0
planner_patience: 5.0
controller_patience: 3.0
oscillation_timeout: 8.0
oscillation_distance: 0.10
recovery_behavior_enabled: false
recovery_behaviors: []
shutdown_costmaps: false

global_costmap:
  global_frame: camera_init
  robot_base_frame: body
  update_frequency: 3.0
  publish_frequency: 1.0
  transform_tolerance: 0.4
  rolling_window: true
  width: 70.0
  height: 70.0
  resolution: 0.10
  track_unknown_space: false
  footprint: [[0.325, 0.275], [0.325, -0.275], [-0.325, -0.275], [-0.325, 0.275]]
  footprint_padding: 0.015
  plugins:
    - {name: obstacles, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation, type: "costmap_2d::InflationLayer"}
  obstacles:
    observation_sources: lidar
    lidar: {topic: /lab26/obstacles, data_type: PointCloud2, sensor_frame: body, marking: true, clearing: true, obstacle_range: 5.5, raytrace_range: 6.0, min_obstacle_height: -1.0, max_obstacle_height: 1.0, observation_persistence: 0.0, expected_update_rate: 0.5}
  inflation: {inflation_radius: 0.65, cost_scaling_factor: 5.0}

local_costmap:
  global_frame: camera_init
  robot_base_frame: body
  update_frequency: 10.0
  publish_frequency: 2.0
  transform_tolerance: 0.4
  rolling_window: true
  width: 8.0
  height: 8.0
  resolution: 0.04
  track_unknown_space: false
  footprint: [[0.325, 0.275], [0.325, -0.275], [-0.325, -0.275], [-0.325, 0.275]]
  footprint_padding: 0.015
  plugins:
    - {name: obstacles, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation, type: "costmap_2d::InflationLayer"}
  obstacles:
    observation_sources: lidar
    lidar: {topic: /lab26/obstacles, data_type: PointCloud2, sensor_frame: body, marking: true, clearing: true, obstacle_range: 3.8, raytrace_range: 4.0, min_obstacle_height: -1.0, max_obstacle_height: 1.0, observation_persistence: 0.0, expected_update_rate: 0.5}
  inflation: {inflation_radius: 0.60, cost_scaling_factor: 5.0}

DWAPlannerROS:
  odom_topic: /lab26/chassis_odom
  max_vel_x: 0.5
  min_vel_x: -0.10
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_trans: 0.5
  min_vel_trans: 0.0
  max_vel_theta: 0.7
  min_vel_theta: 0.0
  acc_lim_x: 0.2
  acc_lim_y: 0.0
  acc_lim_trans: 0.2
  acc_lim_theta: 0.6
  xy_goal_tolerance: 0.20
  yaw_goal_tolerance: 3.141593
  latch_xy_goal_tolerance: true
  trans_stopped_vel: 0.02
  theta_stopped_vel: 0.03
  sim_time: 2.5
  sim_granularity: 0.025
  angular_sim_granularity: 0.05
  vx_samples: 15
  vy_samples: 1
  vth_samples: 25
  path_distance_bias: 16.0
  goal_distance_bias: 20.0
  occdist_scale: 0.08
  forward_point_distance: 0.15
  stop_time_buffer: 0.3
  scaling_speed: 0.25
  max_scaling_factor: 0.15
  oscillation_reset_dist: 0.10
  oscillation_reset_angle: 0.30
  twirling_scale: 0.05
  use_dwa: true
